views:
  - title: 🌈 Plant Health
    icon: mdi:palette
    cards:
      - type: markdown
        content: |
          # 🌿 Plant Health Monitor 🌸
          Your colorful greenhouse companion
      - show_state: true
        show_name: true
        camera_view: live
        fit_mode: cover
        type: picture-entity
        entity: camera.esp32_cam_esp32_cam
        aspect_ratio: '16:9'
        name: 🌸 Plant Cam
      - type: grid
        columns: 2
        square: true
        cards:
          - type: entity
            entity: input_number.plant_confidence
            name: 🌟 Confidence Score
            icon: mdi:star-shooting
            state_color: true
            styles:
              card:
                - border-radius: 25px
                - background: linear-gradient(135deg,
                - padding: 30px
                - text-align: center
              icon:
                - color: '#FFD700'
                - font-size: 64px
              name:
                - font-size: 20px
                - font-weight: bold
              state:
                - font-size: 48px
                - font-weight: bold
          - type: entity
            entity: input_text.plant_health_status
            name: 💚 Plant Health
            icon: mdi:heart
            state_color: true
            styles:
              card:
                - border-radius: 25px
                - background: linear-gradient(135deg,
                - padding: 30px
                - text-align: center
              icon:
                - color: '#FF6B6B'
                - font-size: 64px
              name:
                - font-size: 20px
                - font-weight: bold
              state:
                - font-size: 28px
                - font-weight: bold
      - square: false
        type: grid
        columns: 1
        cards:
          - type: gauge
            entity: input_number.plant_confidence
            name: 🌟 Detection Confidence
            unit: '%'
            min: 0
            max: 100
            needle: true
            severity:
              green: 70
              yellow: 40
              red: 20
      - type: grid
        columns: 3
        cards:
          - show_name: true
            show_icon: true
            type: button
            name: 📸 Take Photo
            icon: mdi:camera
            tap_action:
              action: call-service
              service: camera.snapshot
              data:
                entity_id: camera.esp32_cam_esp32_cam
                filename: >-
                  /config/www/snapshots/plant_{{ now().strftime('%Y%m%d_%H%M%S')
                  }}.jpg
          - show_name: true
            show_icon: true
            type: button
            name: 🌸 Open Camera
            icon: mdi:webcam
            tap_action:
              action: url
              url_path: http://10.166.18.200
      - type: history-graph
        title: 📈 Plant Health Journey
        entities:
          - entity: sensor.plant_confidence
            name: 🌟 Confidence
          - entity: sensor.plant_health_percentage
            name: 💚 Vitality
        hours_to_show: 168
      - type: markdown
        content: |
          ## 🌱 Plant Care Tips

          {% set confidence = states('sensor.plant_confidence') | float(0) %}

          {% if confidence < 30 %}
          ### ⚠️ Low confidence detection
          - 📷 Move camera closer to plant
          - 💡 Improve lighting conditions
          - 🌿 Center the plant in frame

          {% elif confidence < 70 %}
          ### 🟡 Good detection - can improve
          - 📸 Take photo from different angle
          - ☀️ Ensure bright, indirect light
          - 💧 Check soil moisture

          {% else %}
          ### ✅ Excellent plant health!
          - 🌱 Continue current care routine
          - 💧 Water when top soil is dry
          - 🌸 Watch for new growth
          {% endif %}
