esphome:
  name: espcam
  friendly_name: ESP32-CAM

esp32:
  board: esp32dev
  framework:
    type: arduino

psram:
  mode: quad

logger:
  level: DEBUG


api:

ota:
  platform: esphome

wifi:
  ssid: "your_wifi_ssid"
  password: "you_wifi_password"
  
  manual_ip:
    static_ip: 10.254.79.200
    gateway: 10.254.79.77
    subnet: 255.255.255.0
    dns1: 8.8.8.8
  
  ap:
    ssid: "ESP32-CAM Setup"
    password: "12345678"

web_server:
  port: 80

# Camera Configuration
esp32_camera:
  id: espcam
  name: ESP32-CAM
  external_clock:
    pin: GPIO0
    frequency: 20MHz
  i2c_pins:
    sda: GPIO26
    scl: GPIO27
  data_pins: [GPIO5, GPIO18, GPIO19, GPIO21, GPIO36, GPIO39, GPIO34, GPIO35]
  vsync_pin: GPIO25
  href_pin: GPIO23
  pixel_clock_pin: GPIO22
  power_down_pin: GPIO32
  resolution: 640x480
  jpeg_quality: 10
  max_framerate: 10 fps

# Flash light
output:
  - platform: ledc
    pin: GPIO4
    id: flash_light

light:
  - platform: binary
    output: flash_light
    id: camera_flash
    name: Camera Flash

# Camera web server
esp32_camera_web_server:
  - port: 8080
    mode: stream
  - port: 8081
    mode: snapshot

# Status LED
status_led:
  pin: GPIO33
