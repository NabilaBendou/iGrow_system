                ha-card {
                  cursor: pointer;
                }
                ha-card:hover {
                  background: rgb(36, 55, 45);
                  box-shadow: 0 4px 8px rgba(0,0,0,0.15);
                }
                ha-card:active {
                  transform: scale(0.97);
