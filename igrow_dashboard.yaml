    theme: agriculture_green
    show_icon_and_title: true
  - title: Alerts
    icon: mdi:robot
    path: alerts
    type: masonry
    badges: []
    cards:
      - type: markdown
        content: >
          ## 📊 Current Conditions


          {% set temp =
          states('sensor.greenhouse_sensor_greenhouse_temperature_2') | float(0)
          | round(1) %}

          {% set humidity =
          states('sensor.greenhouse_sensor_greenhouse_humidity_2') | float(0) |
          round(1) %}

          {% set moisture = states('input_number.soil_moisture') | float(0) |
          round(1) %}

          {% set vpd = states('sensor.greenhouse_vpd') | float(0) | round(2) %}

          {% set dew = states('sensor.greenhouse_dew_point') | float(0) |
          round(1) %}

          {% set heat_index = states('sensor.greenhouse_heat_index') | float(0)
          | round(1) %}

          {% set abs_hum = states('sensor.greenhouse_absolute_humidity') |
          float(0) | round(1) %}

          {% set light = states('sensor.greenhouse_light_level') | float(0) |
          int %}

          {% set fan = states('input_boolean.fan_virtual') %}

          {% set pump = states('input_boolean.pump_virtual') %}

          {% set lights = states('input_boolean.light_virtual') %}


          | Sensor | Value | Status |

          |:-------|------:|:------:|

          | 🌡️ Temperature | **{{ temp }}°C** | {% if temp > 35 %}🔥 Critical{%
          elif temp > 30 %}⚠️ High{% elif temp < 10 %}🧊 Cold{% else %}✅
          Normal{% endif %} |

          | 💧 Humidity | **{{ humidity }}%** | {% if humidity > 80 %}💧 Too
          High{% elif humidity > 70 %}⚠️ High{% elif humidity < 30 %}🌵
          Critical{% elif humidity < 40 %}⚠️ Low{% else %}✅ Normal{% endif %} |

          | 🌱 Soil Moisture | **{{ moisture }}%** | {% if moisture < 20 %}🚨
          Water Now{% elif moisture < 30 %}⚠️ Low{% elif moisture > 85 %}⚠️
          Overwatered{% else %}✅ Normal{% endif %} |

          | 🌿 VPD | **{{ vpd }} kPa** | {% if vpd > 1.6 %}🔴 Too Dry{% elif vpd
          < 0.4 %}🔵 Too Wet{% else %}✅ Ideal{% endif %} |

          | 🌡️ Feels Like | **{{ heat_index }}°C** | {% if heat_index > 38 %}🔥
          Dangerous{% elif heat_index > 32 %}⚠️ High{% else %}✅ OK{% endif %} |

          | 💦 Dew Point | **{{ dew }}°C** | {% if dew > 16 %}⚠️ Condensation
          Risk{% else %}✅ Safe{% endif %} |

          | 💨 Abs. Humidity | **{{ abs_hum }} g/m³** | {% if abs_hum > 15 %}💧
          High{% elif abs_hum < 6 %}🌵 Low{% else %}✅ Normal{% endif %} |

          | ☀️ Light | **{{ light }} lux** | {% if light < 200 %}🌑 Too Dark{%
          elif light < 600 %}⚠️ Low{% else %}✅ Good{% endif %} |


          ---


          ⚙️ **Actuators** &nbsp; 💡 {% if lights == 'on' %}🟢 ON{% else %}⚫
          OFF{% endif %} &nbsp;·&nbsp; 🌬️ {% if fan == 'on' %}🟢 ON{% else %}⚫
          OFF{% endif %} &nbsp;·&nbsp; 💧 {% if pump == 'on' %}🟢 ON{% else %}⚫
          OFF{% endif %}


          ---


          🤖 **Recommendations**


          {% if temp > 30 and fan == 'off' %}— ⚠️ Temp critical · turn ON fan

          {% endif %}

          {%- if vpd > 1.6 and pump == 'off' %}— 💧 VPD too high · run pump or
          mist

          {% endif %}

          {%- if moisture < 30 and pump == 'off' %}— 🚨 Soil dry · turn ON pump

          {% endif %}

          {%- if humidity > 80 and fan == 'off' %}— 🍄 Humidity high · run fan

          {% endif %}

          {%- if dew > 16 %}— 💦 Dew point high · condensation risk

          {% endif %}

          {%- if light < 200 and lights == 'off' %}— 🌑 Too dark · turn ON grow
          light

          {% endif %}

          {%- if temp <= 30 and humidity >= 40 and humidity <= 70 and moisture
          >= 30 and vpd >= 0.4 and vpd <= 1.6 %}— ✅ All conditions optimal!

          {% endif %}


          ---


          🚨 **Alert:** {{ states('input_text.plant_alert_message') }}
        card_mod:
          style: |
            ha-card {
              border-radius: 20px;
              padding: 20px;
              background: #fff3e0;
              font-size: 14px;
            }
      - type: vertical-stack
        cards:
          - type: custom:button-card
            entity: input_number.critical_alert_level
            name: 🚨 CRITICAL SIROCCO ALERT
            show_state: true
            icon: mdi:weather-dust
            state_display: '[[[ return Math.round(entity.state) + ''%'' ]]]'
            styles:
              card:
                - border-radius: 20px
                - padding: 24px
                - background: |
                    [[[
                      let v = parseFloat(entity.state) || 0;
                      if(v < 30) return 'linear-gradient(135deg,#4CAF50,#81C784)';
                      if(v < 60) return 'linear-gradient(135deg,#FF9800,#FFB74D)';
                      return 'linear-gradient(135deg,#F44336,#E57373)';
                    ]]]
                - animation: |
                    [[[
                      let v = parseFloat(entity.state) || 0;
                      return v > 60 ? 'pulse 1.2s infinite' : 'none';
                    ]]]
              name:
                - color: white
                - font-size: 14px
                - font-weight: 700
                - letter-spacing: 0.05em
              state:
                - color: white
                - font-size: 52px
                - font-weight: bold
              icon:
                - color: white
                - font-size: 36px
                - margin-bottom: 8px
            card_mod:
              style: |
                @keyframes pulse {
                  0% { box-shadow: 0 0 0 0 rgba(244,67,54,0.7); }
                  70% { box-shadow: 0 0 0 20px rgba(244,67,54,0); }
                  100% { box-shadow: 0 0 0 0 rgba(244,67,54,0); }
                }
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: input_text.ai_alert_type
                name: Alert Type
                show_state: true
                icon: mdi:weather-windy
                styles:
                  card:
                    - border-radius: 16px
                    - height: 100px
                    - background: linear-gradient(135deg,#37474F,#546E7A)
                  name:
                    - color: '#B0BEC5'
                    - font-size: 11px
                    - text-transform: uppercase
                    - letter-spacing: 0.1em
                  state:
                    - color: white
                    - font-size: 16px
                    - font-weight: bold
                  icon:
                    - color: '#80CBC4'
              - type: custom:button-card
                entity: input_text.ai_alert_priority
                name: Priority
                show_state: true
                icon: mdi:alert-octagram
                styles:
                  card:
                    - border-radius: 16px
                    - height: 100px
                    - background: |
                        [[[
                          let p = (entity.state || '').toLowerCase();
                          if(p.includes('critical')) return 'linear-gradient(135deg,#B71C1C,#E53935)';
                          if(p.includes('high')) return 'linear-gradient(135deg,#E65100,#FB8C00)';
                          return 'linear-gradient(135deg,#1B5E20,#43A047)';
                        ]]]
                  name:
                    - color: rgba(255,255,255,0.7)
                    - font-size: 11px
                    - text-transform: uppercase
                    - letter-spacing: 0.1em
                  state:
                    - color: white
                    - font-size: 16px
                    - font-weight: bold
                  icon:
                    - color: white
          - type: horizontal-stack
            cards:
              - type: custom:button-card
                entity: input_number.ai_alert_level
                name: Critical Level
                show_state: true
                icon: mdi:gauge
                state_display: '[[[ return Math.round(entity.state) + ''%'' ]]]'
                styles:
                  card:
                    - border-radius: 16px
                    - height: 100px
                    - background: |
                        [[[
                          let v = parseFloat(entity.state) || 0;
                          if(v < 30) return 'linear-gradient(135deg,#1B5E20,#43A047)';
                          if(v < 60) return 'linear-gradient(135deg,#E65100,#FB8C00)';
                          return 'linear-gradient(135deg,#B71C1C,#E53935)';
                        ]]]
                  name:
                    - color: rgba(255,255,255,0.7)
                    - font-size: 11px
                    - text-transform: uppercase
                    - letter-spacing: 0.1em
                  state:
                    - color: white
                    - font-size: 28px
                    - font-weight: bold
                  icon:
                    - color: white
              - type: custom:button-card
                entity: input_text.alert_timestamp
                name: Detected At
                show_state: true
                icon: mdi:clock-alert
                styles:
                  card:
                    - border-radius: 16px
                    - height: 100px
                    - background: linear-gradient(135deg,#4A148C,#7B1FA2)
                  name:
                    - color: rgba(255,255,255,0.7)
                    - font-size: 11px
                    - text-transform: uppercase
                    - letter-spacing: 0.1em
                  state:
                    - color: white
                    - font-size: 14px
                    - font-weight: bold
                  icon:
                    - color: '#CE93D8'
    theme: agriculture_green
    show_icon_and_title: true
  - title: Weather
    icon: mdi:weather-partly-cloudy
