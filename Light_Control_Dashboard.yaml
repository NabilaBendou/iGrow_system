views:
  - type: sections
    sections:
      - type: grid
        cards:
          - type: heading
            heading: 📊 Current Greenhouse Conditions
            heading_style: title
          - type: entities
            entities:
              - entity: sensor.greenhouse_light_level
              - entity: input_boolean.greenhouse_presence
              - entity: sensor.greenhouse_automation_action
              - entity: scene.tuya_on_2
                icon: mdi:lightbulb-on
              - entity: scene.tuya_off_2
                icon: mdi:lightbulb-off
            title: 🌿 Greenhouse Light Control
          - type: markdown
            content: |2-

                **Current:**
                - 💡 Light: **{{ states('sensor.greenhouse_light_level') }} lux**
                - 👤 Presence: **{{ states('binary_sensor.greenhouse_presence') }}**
                - ⚙️ Threshold: **350 lux**
                
                {% set light = states('sensor.greenhouse_light_level') | float(0) %}
                {% set presence = is_state('binary_sensor.greenhouse_presence', 'on') %}
                
                {% if light < 350 and presence %}
                ✅ **Lights ON** (Dark + Occupied)
                {% elif light < 350 and not presence %}
                ⏸️ **Waiting** (Dark but empty)
                {% elif presence and light >= 350 %}
                ☀️ **Lights OFF** (Bright enough)
                {% else %}
                💤 **Standby** (No occupancy)
                {% endif %}
        column_span: 3
      - type: grid
        cards:
          - type: heading
            heading: 💡 Light Control
            heading_style: title
          - type: gauge
            entity: sensor.greenhouse_light_level
            unit: lux
            min: 0
            severity:
              green: 350
              yellow: 150
              red: 50
            max: 1000
            tap_action:
              action: more-info
          - type: grid
            columns: 2
            cards:
              - type: button
                name: 💡 TURN ON
                icon: mdi:lightbulb-on
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  target:
                    entity_id: scene.tuya_on_2
                styles:
                  card:
                    - background-color: '#4CAF50'
                    - color: white
              - type: button
                name: 🌙 TURN OFF
                icon: mdi:lightbulb-off
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  target:
                    entity_id: scene.tuya_off_2
                styles:
                  card:
                    - background-color: '#f44336'
                    - color: white
          - type: history-graph
            title: 📈 Light Level History
            entities:
              - entity: sensor.greenhouse_light_level
                name: Light Level
            hours_to_show: 24
            points_per_hour: 0.5
        column_span: 2
