views:
  - type: sections
    title: 📸 ESP32-CAM Security
    sections:
      - type: grid
        columns: 1
        cards:
          - type: heading
            heading_style: title
            heading: Live Camera Feed
            heading_size: large
            icon: mdi:cctv
          - type: picture-entity
            entity: camera.esp32_cam_esp32_cam
            camera_view: live
            aspect_ratio: '16:9'
            show_state: true
            show_name: true
            name: Greenhouse Camera
            fit_mode: cover
            tap_action:
              action: more-info
            double_tap_action:
              action: call-service
              service: camera.snapshot
              data:
                entity_id: camera.esp32_cam_esp32_cam
                filename: /config/www/snapshot_{{ now().strftime('%Y%m%d_%H%M%S') }}.jpg
            style: |
              ha-card {
                border-radius: 20px;
                box-shadow: 0 8px 16px rgba(0,0,0,0.2);
              }
          - type: grid
            columns: 3
            cards:
              - type: custom:mushroom-template-card
                primary: 🐼 Panda Pic
                secondary: Cheese!
                icon: mdi:panda
                icon_color: grey
                layout: vertical
                tap_action:
                  action: call-service
                  service: camera.snapshot
                  data:
                    entity_id: camera.esp32_cam_esp32_cam
                    filename: >-
                      /config/www/snapshots/cute_{{
                      now().strftime('%Y%m%d_%H%M%S') }}.jpg
                styles:
                  card:
                    - border-radius: 30px
                    - background: linear-gradient(135deg,
                  icon:
                    - color: '#616161'
              - type: custom:mushroom-entity-card
                entity: camera.esp32_cam_esp32_cam
                name: Full Screen
                icon: mdi:fullscreen
                layout: vertical
                tap_action:
                  action: more-info
                icon_color: purple
                fill_container: true
              - type: custom:mushroom-entity-card
                entity: light.esp32_cam_camera_flash
                name: Flashlight
                icon: mdi:flashlight
                layout: vertical
                tap_action:
                  action: toggle
                fill_container: true
          - square: true
            type: grid
            columns: 3
            cards:
              - type: custom:mushroom-template-card
                primary: Camera Status
                secondary: |
                  {% if is_state('camera.esp32_cam_esp32_cam', 'idle') %}
                    🟢 Online
                  {% else %}
                    🟡 Streaming
                  {% endif %}
                icon: mdi:webcam
                color: green
                features_position: bottom
                vertical: true
              - type: custom:mushroom-template-card
                primary: Last Snapshot
                secondary: '{{ as_timestamp(now()) | timestamp_custom(''%H:%M:%S'') }}'
                icon: mdi:camera-timer
                color: blue
                features_position: bottom
                vertical: true
              - type: custom:mushroom-template-card
                primary: Camera IP
                secondary: 10.166.18.200
                icon: mdi:ip-network
                color: cyan
                features_position: bottom
                vertical: true
            grid_options:
              rows: auto
              columns: full
      - type: grid
        columns: 2
        cards:
          - type: heading
            heading_style: subheading
            heading: Motion Events
            icon: mdi:alert
          - type: history-graph
            title: Motion History (24h)
            entities:
              - binary_sensor.greenhouse_presence
            hours_to_show: 24
          - type: entity
            entity: input_boolean.greenhouse_presence
            name: Presence Status
            icon: mdi:motion-sensor
            state_color: true
            grid_options:
              rows: 3
              columns: full
            tap_action:
              action: none
          - type: custom:mushroom-chips-card
            chips:
              - type: entity
                entity: binary_sensor.greenhouse_presence
                content: Presence
              - type: template
                content: >-
                  {{ 'Occupied' if is_state('binary_sensor.greenhouse_presence',
                  'on') else 'Empty' }}
                icon: >-
                  {{ 'mdi:account' if
                  is_state('binary_sensor.greenhouse_presence', 'on') else
                  'mdi:account-off' }}
      - type: grid
        columns: 2
        cards:
          - type: markdown
            title: 📊 Camera Statistics
            content: |
              | Metric | Value |
              |--------|-------|
              | **IP Address** | 10.166.18.200 |
              | **Camera Entity** | camera.esp32_cam_esp32_cam |
              | **Web Server** | [Open](http://10.166.18.200) |
          - type: gauge
            entity: input_number.greenhouse_light_level
            name: Light Level
            unit: lux
            min: 0
            max: 1000
            severity:
              green: 350
              yellow: 150
              red: 50
            grid_options:
              columns: full
              rows: 4
      - type: grid
        columns: 3
        cards:
          - type: heading
            heading_style: subheading
            heading: Greenhouse Environment
            icon: mdi:leaf
          - type: custom:mushroom-template-card
            primary: Temperature
            secondary: '{{ states(''sensor.temperature_serre'') | default(''22'') }}°C'
            icon: mdi:thermometer
            icon_color: orange
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: Light Level
            secondary: '{{ states(''sensor.greenhouse_light_level'') | default(''350'') }} lux'
            icon: mdi:brightness-5
            icon_color: yellow
            tap_action:
              action: more-info
          - type: custom:mushroom-template-card
            primary: Occupancy
            secondary: >-
              {{ '👤 Occupied' if is_state('binary_sensor.greenhouse_presence',
              'on') else '🌙 Empty' }}
            icon: mdi:motion-sensor
            icon_color: >-
              {{ 'green' if is_state('binary_sensor.greenhouse_presence', 'on')
              else 'grey' }}
            tap_action:
              action: more-info
        column_span: 2
      - type: grid
        columns: 2
        cards:
          - type: heading
            heading_style: subheading
            heading: Controls
            icon: mdi:remote
          - type: button
            name: Take Snapshot
            icon: mdi:camera
            tap_action:
              action: call-service
              service: camera.snapshot
              data:
                entity_id: camera.esp32_cam_esp32_cam
                filename: /config/www/snapshots/latest.jpg
            styles:
              card:
                - border-radius: 15px
                - background: linear-gradient(135deg,
          - type: button
            name: Stream URL
            icon: mdi:webcam
            tap_action:
              action: url
              url_path: http://10.166.18.200
            styles:
              card:
                - border-radius: 15px
                - background: linear-gradient(135deg,
