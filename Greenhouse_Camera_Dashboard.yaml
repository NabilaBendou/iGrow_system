views:
  - title: ESP32-CAM
    path: esp32-cam
    icon: mdi:cctv
    badges: []
    cards:
      - type: heading
        heading: Live Camera Feed
        heading_style: title
        heading_size: large
        icon: mdi:cctv
      - type: picture-entity
        entity: camera.esp32_cam_esp32_cam
        camera_view: live
        aspect_ratio: '16:9'
        show_state: true
        show_name: true
        name: Greenhouse Camera
        fit_mode: cover
        tap_action:
          action: more-info
        double_tap_action:
          action: call-service
          service: camera.snapshot
          data:
            entity_id: camera.esp32_cam_esp32_cam
            filename: /config/www/snapshot_{{ now().strftime('%Y%m%d_%H%M%S') }}.jpg
        style: |
          ha-card {
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            transition: transform 0.5s ease;
          }
          ha-card:hover {
            transform: scale(1.03);
          }
      - type: grid
        columns: 3
        square: true
        cards:
          - type: custom:button-card
            entity: camera.esp32_cam_esp32_cam
            name: Take Snapshot
            icon: mdi:camera
            tap_action:
              action: call-service
              service: camera.snapshot
              data:
                entity_id: camera.esp32_cam_esp32_cam
                filename: /config/www/snapshots/latest.jpg
            styles:
              card:
                - background: linear-gradient(135deg,
                - color: white
                - font-weight: bold
                - transition: transform 0.5s ease
            card_mod:
              style: |
                @keyframes pulse {
                  0% { transform: scale(1); }
                  50% { transform: scale(1.05); }
                  100% { transform: scale(1); }
                }
                ha-card:hover {
                  animation: pulse 1s infinite;
                }
          - type: custom:button-card
            entity: light.esp32_cam_camera_flash
            name: Flashlight
            icon: mdi:flashlight
            tap_action:
              action: toggle
            styles:
              card:
                - background: linear-gradient(135deg,
                - color: white
                - font-weight: bold
                - transition: transform 0.5s ease
            state:
              - value: 'on'
                styles:
                  card:
                    - box-shadow: 0 0 20px rgba(33,150,243,0.8)
          - type: custom:button-card
            entity: camera.esp32_cam_esp32_cam
            name: Full Screen
            icon: mdi:fullscreen
            tap_action:
              action: more-info
            styles:
              card:
                - background: linear-gradient(135deg,
                - color: white
                - font-weight: bold
                - transition: transform 0.5s ease
            card_mod:
              style: |
                ha-card:hover {
                  transform: scale(1.05);
                }
      - square: true
        type: grid
        columns: 3
        cards:
          - type: custom:button-card
            entity: camera.esp32_cam_esp32_cam
            name: Camera Status
            icon: mdi:webcam
            show_state: true
            state:
              - value: idle
                styles:
                  card:
                    - background-color: '#4CAF50'
                    - color: white
                    - animation: blink 1.5s infinite
              - value: streaming
                styles:
                  card:
                    - background-color: '#FFC107'
                    - color: white
                    - animation: blink 1.5s infinite
            styles:
              card:
                - height: 120px
                - width: 120px
                - border-radius: 15px
                - display: flex
                - justify-content: center
                - align-items: center
            card_mod:
              style: |
                @keyframes blink {
                  0% { opacity: 1; }
                  50% { opacity: 0.5; }
                  100% { opacity: 1; }
                }
          - type: custom:button-card
            entity: camera.esp32_cam_esp32_cam
            name: Last Snapshot
            icon: mdi:camera-timer
            show_state: true
            state:
              - operator: default
                styles:
                  card:
                    - background: linear-gradient(135deg,
                    - color: white
                    - font-weight: bold
                    - animation: pulse 2s infinite
            label: Latest
            styles:
              card:
                - height: 120px
                - width: 120px
                - border-radius: 15px
                - display: flex
                - justify-content: center
                - align-items: center
            card_mod:
              style: |
                @keyframes pulse {
                  0% { transform: scale(1); }
                  50% { transform: scale(1.05); }
                  100% { transform: scale(1); }
                }
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-entity-card
            entity: input_boolean.greenhouse_presence
            name: 👤 Presence
            icon: mdi:motion-sensor
            layout: vertical
            tap_action:
              action: toggle
            styles:
              card:
                - border-radius: 22px
                - padding: 24px 20px
                - background: '#EDE9FE'
                - border: '1.5px solid #C4B5FD'
                - box-shadow: none
                - transition: transform 0.25s ease
              name:
                - color: '#6D28D9'
                - font-size: 11px
                - font-weight: 700
                - letter-spacing: 0.1em
                - text-transform: uppercase
              icon:
                - color: '#7C3AED'
                - font-size: 34px
              state:
                - color: '#3B0764'
                - font-size: 24px
                - font-weight: 800
          - type: custom:mushroom-entity-card
            entity: input_number.greenhouse_light_level
            name: 💡 Light Level
            icon: mdi:brightness-5
            layout: vertical
            styles:
              card:
                - border-radius: 22px
                - padding: 24px 20px
                - background: '#FFFBEB'
                - border: '1.5px solid #FCD34D'
                - box-shadow: none
                - transition: transform 0.25s ease
              name:
                - color: '#B45309'
                - font-size: 11px
                - font-weight: 700
                - letter-spacing: 0.1em
                - text-transform: uppercase
              icon:
                - color: '#D97706'
                - font-size: 34px
              state:
                - color: '#78350F'
                - font-size: 24px
                - font-weight: 800
          - type: custom:mushroom-template-card
            primary: Status
            secondary: >
              {% set light = states('input_number.greenhouse_light_level') |
              float(0) %}

              {% set presence = is_state('input_boolean.greenhouse_presence',
              'on') %}

              {% if light < 350 and presence %}💡 Lights ON

              {% elif light < 350 and not presence %}⏸ Waiting

              {% elif light >= 350 and presence %}☀️ Lights OFF

              {% else %}💤 Idle{% endif %}
            icon: mdi:lightbulb-auto
            layout: vertical
            styles:
              card:
                - border-radius: 22px
                - padding: 24px 20px
                - background: '#F0FDFA'
                - border: '1.5px solid #5EEAD4'
                - box-shadow: none
                - transition: transform 0.25s ease
              name:
                - color: '#0F766E'
                - font-size: 11px
                - font-weight: 700
                - letter-spacing: 0.1em
                - text-transform: uppercase
              icon:
                - color: '#0D9488'
                - font-size: 34px
              state:
                - color: '#134E4A'
                - font-size: 24px
                - font-weight: 800
