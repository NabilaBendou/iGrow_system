agriculture_green:
  # Vibrant greens
  primary-color: "#66bb6a"
  accent-color: "#81c784"
  dark-primary-color: "#43a047"
  light-primary-color: "#e8f5e9"
  
  # Text - Dark for better contrast on light backgrounds
  primary-text-color: "#212121"
  text-primary-color: "#212121"
  secondary-text-color: "#616161"
  disabled-text-color: "#bdbdbd"
  
  # Background - Very light and clean
  primary-background-color: "#fafafa"
  secondary-background-color: "#f5f5f5"
  card-background-color: "#ffffff"
  
  # Sidebar - Dark green for contrast
  sidebar-background-color: "#1b5e20"
  sidebar-text-color: "#e8f5e9"
  sidebar-selected-background-color: "#2e7d32"
  sidebar-selected-text-color: "#ffffff"
  sidebar-icon-color: "#a5d6a7"
  
  # Icons
  paper-item-icon-color: "#757575"
  paper-item-icon-active-color: "#43a047"
  
  # Switches
  switch-checked-button-color: "#43a047"
  switch-checked-track-color: "#a5d6a7"
  
  # Tables - Clean white
  table-row-background-color: "#ffffff"
  table-row-alternative-background-color: "#fafafa"